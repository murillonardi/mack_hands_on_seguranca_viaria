name: Deploy Data Pipelines (Cloud Run & Terraform)

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: "project-f1079166-4703-4cc3-975"
  REGION: "us-central1"
  REPOSITORY: "data-pipelines-repo"

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/38933711443/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'mack-github-actions-deploy@project-f1079166-4703-4cc3-975.iam.gserviceaccount.com'

      # 1. Configurar Docker Client
      - name: Configure Docker Client
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # --- 2. BUILD & PUSH DA IMAGEM DO CLOUD RUN ÚNICO ---
      - name: Build & Push Raw Data Create
        run: |
          TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/raw-data-create:${{ github.sha }}"
          docker build -t $TAG ./cloudrun_services/raw_data_create
          docker push $TAG
          echo "RAW_DATA_IMAGE=$TAG" >> $GITHUB_ENV

      # --- 3. INFRAESTRUTURA COMPLETA COM TERRAFORM ---
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Apply (Infra + Cloud Run)
        working-directory: ./terraform
        env:
          TF_VAR_project_id: ${{ env.PROJECT_ID }}
          TF_VAR_region: ${{ env.REGION }}
          TF_VAR_raw_data_image: ${{ env.RAW_DATA_IMAGE }}
        run: terraform apply -auto-approve
