name: Deploy Data Pipelines (Cloud Run & Terraform)

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: "project-f1079166-4703-4cc3-975"
  REGION: "us-central1"
  REPOSITORY: "data-pipelines-repo"

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/754291410291/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-actions-deployer@project-f1079166-4703-4cc3-975.iam.gserviceaccount.com'

      # 1. Configurar Docker Client
      - name: Configure Docker Client
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # --- 2. BUILD & PUSH DAS 6 IMAGENS DOCKER ---
      - name: Build & Push InfoSiga
        run: |
          TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/infosiga-ingestion:${{ github.sha }}"
          docker build -t $TAG ./cloudrun_services/infosiga
          docker push $TAG
          echo "INFOSIGA_IMAGE=$TAG" >> $GITHUB_ENV

      - name: Build & Push SEADE IDPM
        run: |
          TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/seade-idpm-ingestion:${{ github.sha }}"
          docker build -t $TAG ./cloudrun_services/seade_idpm
          docker push $TAG
          echo "SEADE_IDPM_IMAGE=$TAG" >> $GITHUB_ENV

      - name: Build & Push SEADE IDPM Grupos
        run: |
          TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/seade-idpm-grupos-ingestion:${{ github.sha }}"
          docker build -t $TAG ./cloudrun_services/seade_idpm_grupos
          docker push $TAG
          echo "SEADE_IDPM_GRUPOS_IMAGE=$TAG" >> $GITHUB_ENV

      - name: Build & Push SEADE Mortalidade
        run: |
          TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/seade-mortalidade-ingestion:${{ github.sha }}"
          docker build -t $TAG ./cloudrun_services/seade_mortalidade
          docker push $TAG
          echo "SEADE_MORTALIDADE_IMAGE=$TAG" >> $GITHUB_ENV

      - name: Build & Push SEADE IPVS Entorno
        run: |
          TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/seade-ipvs-entorno-ingestion:${{ github.sha }}"
          docker build -t $TAG ./cloudrun_services/seade_ipvs_entorno
          docker push $TAG
          echo "SEADE_IPVS_ENTORNO_IMAGE=$TAG" >> $GITHUB_ENV

      # --- 3. INFRAESTRUTURA COMPLETA COM TERRAFORM ---
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Apply (Infra + Cloud Run)
        working-directory: ./terraform
        env:
          TF_VAR_project_id: ${{ env.PROJECT_ID }}
          TF_VAR_region: ${{ env.REGION }}
          TF_VAR_infosiga_image: ${{ env.INFOSIGA_IMAGE }}
          TF_VAR_seade_image: ${{ env.SEADE_IPVS_IMAGE }}
          TF_VAR_seade_idpm_image: ${{ env.SEADE_IDPM_IMAGE }}
          TF_VAR_seade_idpm_grupos_image: ${{ env.SEADE_IDPM_GRUPOS_IMAGE }}
          TF_VAR_seade_mortalidade_image: ${{ env.SEADE_MORTALIDADE_IMAGE }}
          TF_VAR_seade_ipvs_entorno_image: ${{ env.SEADE_IPVS_ENTORNO_IMAGE }}
        run: terraform apply -auto-approve
