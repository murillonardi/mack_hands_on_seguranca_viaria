name: Test SEADE Connection

on:
  workflow_dispatch: # Permite disparar manualmente pelo botão no GitHub

jobs:
  test-ip:
    runs-on: ubuntu-latest
    steps:
      - name: Test download with curl
        run: |
          echo "Iniciando teste de conexão com o SEADE..."
          
          curl -v \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            "https://repositorio.seade.gov.br/dataset/f714bdee-3f8c-464e-9e45-07a0e444937a/resource/5684399c-2175-4749-8914-babd5c9eaaef/download/ipdm.csv" \
            --output downloaded_ipdm.csv \
            --max-time 30

          echo "Verificando o arquivo baixado:"
          ls -lh downloaded_ipdm.csv
          head -n 5 downloaded_ipdm.csv || echo "Arquivo não gerado ou vazio."
